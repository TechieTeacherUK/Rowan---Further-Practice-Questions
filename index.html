const tr=n=>`<p style="margin:2px 0 0;font-size:13px;color:var(--m)">${n}</p>`;
const Q=[
{n:25,m:3,q:`<p>Solve 3x² + 4x − 2 = 0. Use the quadratic formula and give your solutions correct to 2 decimal places. (3)</p>`,
s:[`Compare with ax² + bx + c = 0: a = 3, b = 4, c = −2.`,`Write the formula with brackets: x = (−4 ± √(4² − 4(3)(−2))) ÷ (2 × 3).`,`Discriminant: 16 + 24 = 40, so x = (−4 ± √40) ÷ 6 and √40 = 6.3246…`,`x = (−4 + 6.3246…) ÷ 6 = 0.3874… = 0.39`,`x = (−4 − 6.3246…) ÷ 6 = −1.7207… = −1.72`],a:`x = 0.39 or x = −1.72`,t:`With c = −2, the −4ac term becomes +24. Round only at the end.`},
{n:26,m:3,q:`<p>O is the origin. OA = a and OB = b. M is the midpoint of AB. Find the vector OM in terms of a and b. Give your answer in its simplest form. (3)</p>`,
s:[`Sketch O, A, B and mark M halfway along AB.`,`AB = AO + OB = −a + b = b − a.`,`M is the midpoint, so AM = ½AB = ½(b − a).`,`OM = OA + AM = a + ½(b − a).`,`= a + ½b − ½a = ½a + ½b = ½(a + b).`],a:`OM = ½(a + b)`},
{n:27,m:3,q:`<p>In triangle ABC, angle A = 40°, angle B = 65° and side a (opposite angle A) = 8 cm. Work out the length of side b (opposite angle B). Give your answer correct to 3 significant figures. (3)</p>`,
s:[`Match each side with its opposite angle: a = 8 cm is opposite A = 40°; b is opposite B = 65°.`,`Sine rule: a ÷ sin A = b ÷ sin B, so 8 ÷ sin 40° = b ÷ sin 65°.`,`Rearrange: b = 8 × sin 65° ÷ sin 40°.`,`b = 8 × 0.9063… ÷ 0.6428… = 11.279…`,`b = 11.3 cm (3 s.f.)`],a:`11.3 cm`,t:`Make sure the calculator is in degree mode.`},
{n:28,m:3,q:`<p>Triangle ABC has AB = 7 cm, BC = 9 cm and AC = 11 cm. Work out the size of angle C (the angle opposite AC is not angle C — angle C is at vertex C, opposite side AB). Use the cosine rule, and give your answer correct to 1 decimal place. (3)</p>`,
s:[`Label each side opposite its angle: a = BC = 9, b = AC = 11, c = AB = 7 (c is opposite C).`,`Cosine rule for an angle: cos C = (a² + b² − c²) ÷ (2ab).`,`cos C = (9² + 11² − 7²) ÷ (2 × 9 × 11) = (81 + 121 − 49) ÷ 198 = 153/198.`,`C = cos⁻¹(153/198) = 39.40…°`,`C = 39.4° (1 d.p.)`],a:`39.4°`},
{n:29,m:3,q:`<p>A cuboid has length 6 cm, width 8 cm and height 10 cm. Work out the length of the diagonal that runs from one corner of the cuboid to the opposite corner. Give your answer correct to 3 significant figures. (3)</p>`,
s:[`3D Pythagoras: d² = l² + w² + h².`,`d² = 6² + 8² + 10² = 36 + 64 + 100 = 200.`,`d = √200 = 14.142…`,`d = 14.1 cm (3 s.f.)`,`(Same in two steps: base diagonal √(36 + 64) = 10, then √(10² + 10²) = √200.)`],a:`14.1 cm`},
{n:30,m:3,q:`<p>y is directly proportional to x². When x = 4, y = 48. Work out the value of y when x = 7. (3)</p>`,
s:[`Directly proportional to x²: y = kx².`,`Substitute x = 4, y = 48: 48 = k × 16, so k = 3.`,`The formula is y = 3x².`,`When x = 7: y = 3 × 49 = 147.`],a:`y = 147`},
{n:31,m:2,q:`<p>p is inversely proportional to q. When q = 5, p = 8. Work out the value of p when q = 20. (2)</p>`,
s:[`Inversely proportional: p = k ÷ q.`,`Substitute q = 5, p = 8: 8 = k ÷ 5, so k = 40.`,`The formula is p = 40 ÷ q.`,`When q = 20: p = 40 ÷ 20 = 2.`],a:`p = 2`},
{n:32,m:3,q:`<p>Two cylinders are mathematically similar. The ratio of their heights is 2 : 5. The volume of the smaller cylinder is 40 cm³. Work out the volume of the larger cylinder. (3)</p>`,
s:[`Heights are in the ratio 2 : 5, so the length scale factor from small to large is 5/2.`,`Volumes scale by the cube: (5/2)³ = 125/8.`,`Larger volume = 40 × 125/8 = 625.`,`Check: 40 ÷ 8 = 5, then 5 × 125 = 625.`],a:`625 cm³`},
{n:33,m:2,q:`<p>Work out (3.2 × 10⁵) × (5 × 10³). Give your answer in standard form. (2)</p>`,
s:[`Multiply the numbers: 3.2 × 5 = 16.`,`Add the powers of 10: 10⁵ × 10³ = 10⁸.`,`So the product is 16 × 10⁸, but 16 is not between 1 and 10, so this is not yet standard form.`,`16 × 10⁸ = 1.6 × 10 × 10⁸ = 1.6 × 10⁹.`],a:`1.6 × 10⁹`,t:`Stopping at 16 × 10⁸ loses the final mark.`},
{n:34,m:3,q:`<p>Write 3/(x + 1) + 2/(x − 2) as a single fraction in its simplest form. (3)</p>`,
s:[`Common denominator: (x + 1)(x − 2).`,`Rewrite each fraction: 3(x − 2) / ((x + 1)(x − 2)) + 2(x + 1) / ((x + 1)(x − 2)).`,`Add the numerators: 3(x − 2) + 2(x + 1) = 3x − 6 + 2x + 2 = 5x − 4.`,`Answer: (5x − 4) / ((x + 1)(x − 2)). Nothing cancels, so this is simplest.`],a:`(5x − 4) / ((x + 1)(x − 2))`},
{n:35,m:2,q:`<p>Write x² + 6x + 2 in the form (x + a)² + b, where a and b are integers. (2)</p>`,
s:[`Half the coefficient of x: 6 ÷ 2 = 3, so a = 3.`,`Expand (x + 3)² = x² + 6x + 9.`,`We need +2 not +9, so subtract 7: x² + 6x + 2 = (x + 3)² − 7.`,`a = 3 and b = −7.`],a:`(x + 3)² − 7`},
{n:36,m:3,q:`<p>Here are the first five terms of a quadratic sequence:<br>3 &nbsp; 8 &nbsp; 15 &nbsp; 24 &nbsp; 35<br>Find an expression, in terms of n, for the nth term of this sequence. (3)</p>`,
s:[`First differences: 5, 7, 9, 11.`,`Second differences: 2, 2, 2 (constant), so a = 2 ÷ 2 = 1: the sequence starts with n².`,`Subtract n² (1, 4, 9, 16, 25) from the terms: 2, 4, 6, 8, 10.`,`That remainder is 2n.`,`nth term = n² + 2n.`],a:`n² + 2n`},
{n:37,m:4,q:`<p>Solve the simultaneous equations<br>y = x + 1<br>y = x² − 5<br>You must show all your working. (4)</p>`,
s:[`Set the two expressions for y equal: x² − 5 = x + 1.`,`Rearrange to zero: x² − x − 6 = 0.`,`Factorise: (x − 3)(x + 2) = 0, so x = 3 or x = −2.`,`Use y = x + 1: x = 3 gives y = 4; x = −2 gives y = −1.`,`Check in y = x² − 5: 9 − 5 = 4 ✓ and 4 − 5 = −1 ✓`],a:`x = 3, y = 4 and x = −2, y = −1`},
{n:38,m:4,q:`<p>f(x) = 2x − 1 and g(x) = x².</p><p><b>(a)</b> Find fg(x) in its simplest form. (2)</p><p><b>(b)</b> Find gf(x) in its simplest form. (2)</p>`,
s:[`<b>(a)</b> fg(x) means f(g(x)): do g first, then f. g(x) = x².`,`<b>(a)</b> Put x² into f: fg(x) = 2(x²) − 1 = 2x² − 1.`,`<b>(b)</b> gf(x) means g(f(x)): do f first, then g. f(x) = 2x − 1.`,`<b>(b)</b> Square it: gf(x) = (2x − 1)² = (2x − 1)(2x − 1) = 4x² − 2x − 2x + 1 = 4x² − 4x + 1.`],a:`(a) 2x² − 1 (b) 4x² − 4x + 1`},
{n:39,m:2,q:`<p>Triangle ABC and triangle DEF are such that AB = DE, BC = EF and angle ABC = angle DEF. State the condition, and hence explain why triangle ABC is congruent to triangle DEF. (2)</p>`,
s:[`Two pairs of sides are equal (AB = DE and BC = EF) and the angle between them is equal: angle ABC lies between AB and BC, and angle DEF lies between DE and EF.`,`<b>Condition: SAS</b> (side, angle, side).`,`Explain: two sides and the included angle are equal, so triangle ABC is congruent to triangle DEF (SAS).`],a:`SAS: two sides and the included angle are equal`},
{n:40,m:4,q:`<p>O is the centre of a circle.</p><p><b>(a)</b> A, B and C are points on the circumference. Angle ABC = 50°. Work out the size of angle AOC (the angle at the centre standing on the same arc as angle ABC). (2)</p><p><b>(b)</b> ABCD is a cyclic quadrilateral. Angle A = 75°. Work out the size of angle C. (2)</p>`,
s:[`<b>(a)</b> The angle at the centre is twice the angle at the circumference (same arc AC).`,`<b>(a)</b> Angle AOC = 2 × 50° = 100°.`,`<b>(b)</b> Opposite angles of a cyclic quadrilateral add up to 180°, and A and C are opposite.`,`<b>(b)</b> Angle C = 180° − 75° = 105°.`],a:`(a) 100° (b) 105°`,t:`Always write the circle theorem as the reason.`},
{n:41,m:4,q:`<p>A bag contains 5 red counters and 3 blue counters. Rui takes a counter at random from the bag and does not replace it. He then takes a second counter at random from the bag.</p><p>Work out the probability that the two counters are the same colour. (4)</p>`,
s:[`Draw a tree diagram. After the first counter is taken there are only 7 left.`,`P(red, red) = 5/8 × 4/7 = 20/56.`,`P(blue, blue) = 3/8 × 2/7 = 6/56.`,`Same colour means RR or BB, so add: 20/56 + 6/56 = 26/56.`,`Simplify: 26/56 = 13/28.`],a:`13/28`},
{n:42,m:3,q:`<p>The equation x² − 3x − 5 = 0 has a positive root that can be found using the iteration x₍ₙ₊₁₎ = √(3xₙ + 5), with x₀ = 2.</p><p>Find the values of x₁, x₂ and x₃, giving each answer correct to 3 decimal places. (3)</p>`,
s:[`x₁ = √(3 × 2 + 5) = √11 = 3.3166… = 3.317`,`x₂ = √(3 × 3.3166… + 5) = √14.9498… = 3.8665… = 3.867`,`x₃ = √(3 × 3.8665… + 5) = √16.5995… = 4.0742… = 4.074`,`(Use the unrounded calculator value each time, e.g. with the Ans key.)`],a:`x₁ = 3.317, x₂ = 3.867, x₃ = 4.074`}
];

const TH={
25:U([`<b>Quadratic formula:</b> x = (−b ± √(b² − 4ac)) ÷ 2a for ax² + bx + c = 0.`,`Write a, b and c with their signs (here c = −2). Put negative numbers in brackets.`,`The ± gives <b>two solutions</b>. Work out b² − 4ac (the discriminant) first.`,`Keep the full calculator value and round only at the end (2 d.p.).`]),
26:U([`A vector from P to Q is PQ = −OP + OQ = q − p (using position vectors).`,`Going backwards reverses the sign: BA = −AB.`,`<b>Midpoint</b> of AB: OM = OA + ½AB = ½(a + b).`,`Give the answer in simplest form by collecting the a terms and the b terms.`]),
27:U([`<b>Sine rule:</b> a ÷ sin A = b ÷ sin B = c ÷ sin C (each side is opposite its angle).`,`Use it when you know an angle and its opposite side, plus one more angle or side.`,`To find a side, put the unknown on top: b = a × sin B ÷ sin A.`,`Angles in a triangle add up to 180°. Calculator in degrees.`]),
28:U([`<b>Cosine rule for an angle:</b> cos C = (a² + b² − c²) ÷ 2ab, where c is opposite C.`,`Use it when you know all three sides.`,`Label the sides opposite their angles first, then work out top, bottom, divide, and press cos⁻¹.`,`Do not round before the final step.`]),
29:U([`<b>3D Pythagoras:</b> d² = l² + w² + h² for the diagonal of a cuboid.`,`Or use Pythagoras twice: the base diagonal first, then with the height.`,`Square root at the end and round to 3 s.f.`]),
30:U([`y is directly proportional to x² means <b>y = kx²</b>.`,`Use the given pair of values to find k, then use the formula with the new x.`,`The graph of y = kx² is a curve through the origin.`]),
31:U([`p is inversely proportional to q means <b>p = k ÷ q</b> (so p × q is always k).`,`Use the given pair to find k, then use the formula with the new q.`,`When q increases, p decreases.`]),
32:U([`<b>Similar shapes:</b> same shape, different size. Matching lengths are in the ratio of the scale factor k.`,`Areas are in the ratio <b>k²</b> and volumes in the ratio <b>k³</b>.`,`Heights 2 : 5 give a length scale factor of 5/2 (small to large).`,`Larger volume = smaller volume × k³.`]),
33:U([`<b>Standard form:</b> A × 10ⁿ with 1 ≤ A &lt; 10 and n an integer.`,`Multiply the numbers; add the powers: 10ᵃ × 10ᵇ = 10ᵃ⁺ᵇ.`,`If A ends up at 10 or more, move a factor of 10 into the power.`]),
34:U([`To add fractions, use a <b>common denominator</b>: here (x + 1)(x − 2).`,`Multiply each numerator by the bracket its fraction was missing.`,`Add the numerators, expand and simplify. Leave the denominator factorised.`,`Check whether the top and bottom have a common factor to cancel.`]),
35:U([`<b>Completing the square:</b> x² + bx + c = (x + b/2)² + (c − (b/2)²).`,`a is <b>half</b> the coefficient of x.`,`Expand (x + a)² to see the constant you get, then adjust to match the original.`]),
36:U([`A quadratic sequence has a <b>constant second difference</b>.`,`nth term = an² + bn + c, where a = (second difference) ÷ 2.`,`Subtract an² from every term, then find the linear part bn + c of what is left.`]),
37:U([`<b>Substitution:</b> replace y in one equation using the other.`,`Rearrange to = 0 and solve the quadratic (factorise or use the formula).`,`Substitute each x back into the <b>linear</b> equation to find y. There are two pairs of answers.`,`Write each solution as a pair of x and y values.`]),
38:U([`<b>fg(x)</b> means “do g first, then f”: f(g(x)).`,`<b>gf(x)</b> means “do f first, then g”: g(f(x)).`,`Put the inside function wherever x appears in the outside function.`,`Expand squared brackets fully: (2x − 1)² = (2x − 1)(2x − 1).`]),
39:U([`The four conditions for congruent triangles: <b>SSS, SAS, ASA (or AAS), RHS</b>.`,`<b>SAS:</b> two sides and the <b>included angle</b> (the angle between them) are equal.`,`Say which parts are equal, state the condition, and conclude “so the triangles are congruent”.`]),
40:U([`The angle at the <b>centre</b> is <b>twice</b> the angle at the circumference (standing on the same arc).`,`<b>Opposite</b> angles in a cyclic quadrilateral add up to 180°.`,`Always state the circle theorem as your reason.`]),
41:U([`<b>Without replacement:</b> the second probability changes because there is one fewer counter.`,`Multiply along the branches (AND); add the different routes (OR).`,`“Same colour” means RR <i>or</i> BB.`,`Draw a tree diagram and label every branch.`]),
42:U([`<b>Iteration:</b> use x₍ₙ₊₁₎ = f(xₙ) again and again, starting from x₀.`,`On a calculator: type x₀, press =, then type the formula using <b>Ans</b> and keep pressing =.`,`Keep full calculator values between steps. Round only the answers to 3 d.p.`])};
const h4=(t,b)=>`<h4>${t}</h4>${b}`,eg=t=>`<div class="eg">${t}</div>`;
const TE={
25:h4('The idea',`<p>Some quadratics will not factorise. The <b>quadratic formula</b> always works.</p>`)+h4('Method',`<p>1. Rearrange to ax² + bx + c = 0 and write down a, b, c <b>with signs</b>.<br>2. Substitute into x = (−b ± √(b² − 4ac)) ÷ 2a using brackets.<br>3. Work out the discriminant b² − 4ac, then the two answers (one with +, one with −).<br>4. Round at the end.</p>`)+eg(`<b>Example:</b> 2x² + 7x + 1 = 0. a = 2, b = 7, c = 1.<br>b² − 4ac = 49 − 8 = 41.<br>x = (−7 ± √41) ÷ 4 = −0.15 or −3.35 (2 d.p.)`)+h4('Common mistakes',`<p>Forgetting that −b is +7 when b = −7, dropping the bracket around a negative so b² comes out negative, and dividing only part of the top by 2a.</p>`),
26:h4('The idea',`<p>A vector tells you a journey. <b>OA = a</b> means the journey from O to A is a. Going the other way round gives the negative: AO = −a.</p>`)+h4('Method',`<p>1. Find AB by going A → O → B: AB = −a + b.<br>2. The midpoint is halfway, so AM = ½AB.<br>3. Route to M: OM = OA + AM.<br>4. Collect like terms.</p>`)+eg(`<b>Example:</b> OP = 2p, OQ = 6q, N is the midpoint of PQ.<br>PQ = −2p + 6q, PN = −p + 3q, ON = 2p + (−p + 3q) = p + 3q.<br><b>Shortcut:</b> midpoint = ½(2p + 6q) = p + 3q ✓`)+h4('Common mistakes',`<p>Getting a sign wrong when going backwards, or writing b + a for AB (it is b − a).</p>`),
27:h4('The idea',`<p>In any triangle, side ÷ sine of the opposite angle is the same for all three sides.</p>`)+h4('Method',`<p>1. Label sides a, b, c opposite angles A, B, C.<br>2. Choose the two pairs you need (one complete pair, one pair with the unknown).<br>3. Write a/sin A = b/sin B and rearrange for the unknown.<br>4. Use a calculator in <b>degrees</b>.</p>`)+eg(`<b>Example:</b> A = 50°, B = 70°, a = 6 cm. b = 6 × sin 70° ÷ sin 50° = 7.36 cm.`)+h4('Common mistakes',`<p>Pairing a side with the wrong angle (a goes with A), calculator in radians, and rounding too early.</p>`),
28:h4('The idea',`<p>The cosine rule links all three sides with one angle. It is used when you know three sides.</p>`)+h4('Method',`<p>Rearranged for an angle: cos C = (a² + b² − c²) ÷ (2ab), where c is the side <b>opposite</b> C.<br>1. Label the sides.<br>2. Work out the top (a² + b² − c²).<br>3. Work out the bottom (2ab).<br>4. Divide, then press cos⁻¹.</p>`)+eg(`<b>Example:</b> sides 5, 6, 7. Angle opposite 7: cos = (25 + 36 − 49) ÷ 60 = 0.2, angle = 78.5°.`)+h4('Common mistakes',`<p>Putting the wrong side as c, forgetting brackets on the top of the fraction on a calculator, and rounding before cos⁻¹.</p>`),
29:h4('The idea',`<p>A cuboid diagonal goes through the inside of the box from one corner to the opposite corner. It is a hypotenuse of a right-angled triangle whose legs are the base diagonal and the height.</p>`)+h4('Method',`<p>Use d² = l² + w² + h². Add the three squares, then square root.</p>`)+eg(`<b>Example:</b> 3 × 4 × 12 cuboid. d² = 9 + 16 + 144 = 169, so d = 13.`)+h4('Common mistakes',`<p>Forgetting the height, or forgetting the final square root.</p>`),
30:h4('The idea',`<p>“y is directly proportional to x²” means y is always the same multiple of x². That multiple is the constant k.</p>`)+h4('Method',`<p>1. Write y = kx².<br>2. Substitute the pair to find k.<br>3. Write the formula with k.<br>4. Substitute the new x.</p>`)+eg(`<b>Example:</b> y ∝ x², y = 20 when x = 2. 20 = k × 4, k = 5. When x = 3, y = 5 × 9 = 45.`)+h4('Common mistakes',`<p>Writing y = kx instead of y = kx², and forgetting to square the new x.</p>`),
31:h4('The idea',`<p>“p is inversely proportional to q” means p × q stays the same. If q is multiplied by 4, p is divided by 4.</p>`)+h4('Method',`<p>1. Write p = k ÷ q.<br>2. Substitute the pair to find k = p × q.<br>3. Substitute the new q.</p>`)+eg(`<b>Example:</b> p = 6 when q = 4: k = 24. When q = 3: p = 24 ÷ 3 = 8.`)+h4('Common mistakes',`<p>Multiplying instead of dividing, or using direct proportion (p = kq).</p>`),
32:h4('The idea',`<p>Similar solids are enlargements of each other. If lengths are multiplied by k, then areas are multiplied by k² and volumes by k³.</p>`)+h4('Method',`<p>1. Find the length scale factor from the ratio.<br>2. Cube it for volume.<br>3. Multiply the known volume.</p>`)+eg(`<b>Example:</b> similar prisms with lengths in ratio 1 : 3 and the small volume is 10 cm³. Volume ratio 1 : 27 so large volume = 270 cm³.`)+h4('Common mistakes',`<p>Using the length ratio 5/2 for volume (it must be cubed), or using the wrong direction (small to large means ×).</p>`),
33:h4('The idea',`<p>Standard form writes any number as A × 10ⁿ with A between 1 and 10 (A can be 1 but not 10).</p>`)+h4('Multiplying',`<p>Multiply the number parts, add the powers of ten. Then check A is between 1 and 10 and adjust.</p>`)+eg(`<b>Example:</b> (4 × 10⁶) × (7 × 10²) = 28 × 10⁸ = 2.8 × 10⁹.`)+h4('Common mistakes',`<p>Multiplying the powers instead of adding them, and stopping when A is more than 10.</p>`),
34:h4('The idea',`<p>Add algebraic fractions the same way as number fractions: common denominator, then add the tops.</p>`)+h4('Method',`<p>1. Common denominator = product of the two denominators.<br>2. Multiply each top by the other fraction’s denominator.<br>3. Add and simplify the numerator.<br>4. Check for cancelling.</p>`)+eg(`<b>Example:</b> 2/(x + 3) + 1/(x − 1) = (2(x − 1) + 1(x + 3)) / ((x + 3)(x − 1)) = (3x + 1) / ((x + 3)(x − 1)).`)+h4('Common mistakes',`<p>Adding the denominators, forgetting to multiply the whole numerator by the bracket, and sign errors expanding 3(x − 2).</p>`),
35:h4('The idea',`<p>Completing the square rewrites x² + bx + c so x appears only once, inside a square.</p>`)+h4('Method',`<p>1. Halve b to get a.<br>2. Write (x + a)².<br>3. Expand it: it gives x² + bx + a².<br>4. Adjust the constant: add or subtract so it matches c.</p>`)+eg(`<b>Example:</b> x² + 8x + 3. a = 4, (x + 4)² = x² + 8x + 16. We need +3, so subtract 13: (x + 4)² − 13.`)+h4('Common mistakes',`<p>Using b instead of b ÷ 2, and using the wrong sign for the adjustment.</p>`),
36:h4('The idea',`<p>In a quadratic sequence the differences themselves change, but the <b>second difference</b> is constant. The n² coefficient is half of it.</p>`)+h4('Method',`<p>1. Find first differences, then second differences.<br>2. a = second difference ÷ 2.<br>3. Subtract an² from each term.<br>4. The remaining numbers form a linear sequence: find its nth term.</p>`)+eg(`<b>Example:</b> 4, 11, 22, 37. Differences 7, 11, 15; second difference 4 so a = 2. Subtract 2n² (2, 8, 18, 32): 2, 3, 4, 5 = n + 1. nth term = 2n² + n + 1.`)+h4('Common mistakes',`<p>Using the whole second difference as a, and subtracting n² when a is not 1.</p>`),
37:h4('The idea',`<p>A line and a curve meet where their y values are equal. Setting them equal gives a quadratic whose solutions are the x values of the crossing points.</p>`)+h4('Method',`<p>1. Set the two right-hand sides equal.<br>2. Rearrange to = 0.<br>3. Factorise (or formula) and solve.<br>4. Use the linear equation to find each y.<br>5. Pair up each x with its y.</p>`)+eg(`<b>Example:</b> y = 2x and y = x² − 3. x² − 2x − 3 = 0, (x − 3)(x + 1) = 0, x = 3 or −1. y = 6 or −2. Solutions: (3, 6) and (−1, −2).`)+h4('Common mistakes',`<p>Stopping after finding x, or pairing the wrong x and y.</p>`),
38:h4('The idea',`<p>A function is a machine. A <b>composite function</b> joins two machines: the output of one becomes the input of the next.</p>`)+h4('Order matters',`<p>fg(x) = f(g(x)): g acts first. gf(x) = g(f(x)): f acts first. They usually give different answers.</p>`)+eg(`<b>Example:</b> f(x) = x + 3, g(x) = 2x. fg(x) = 2x + 3 but gf(x) = 2(x + 3) = 2x + 6.`)+h4('Common mistakes',`<p>Doing the functions in the wrong order, and writing (2x − 1)² = 4x² + 1 (the middle term is missing).</p>`),
39:h4('The idea',`<p>Congruent triangles are identical in shape and size. You only need certain facts to prove it.</p>`)+h4('The four conditions',`<p><b>SSS:</b> three sides.<br><b>SAS:</b> two sides and the angle <b>between</b> them.<br><b>ASA / AAS:</b> two angles and a side.<br><b>RHS:</b> right angle, hypotenuse and one other side.</p>`)+eg(`<b>Why SAS here?</b> The angle ABC is formed by the two sides AB and BC, so it is between the two equal sides. Angle DEF is between DE and EF.`)+h4('Common mistakes',`<p>Using SAS when the equal angle is not between the equal sides, and not writing a conclusion.</p>`),
40:h4('Circle theorems used',`<p><b>Angle at the centre = 2 × angle at the circumference</b> (same arc).<br><b>Cyclic quadrilateral:</b> all four corners on the circle; opposite angles add up to 180°.</p>`)+eg(`<b>Example:</b> angle at the circumference 35° gives angle at the centre 70°. In a cyclic quadrilateral with angle B = 110°, angle D = 70°.`)+h4('Common mistakes',`<p>Halving instead of doubling, using 360° instead of 180°, and writing no reason.</p>`),
41:h4('The idea',`<p>When a counter is not replaced, the number of counters drops, so the second probability depends on the first outcome.</p>`)+h4('Method',`<p>1. Draw the tree and label first and second picks.<br>2. After a red is taken there are fewer reds and fewer counters in total.<br>3. Multiply along each route you want.<br>4. Add the routes.</p>`)+eg(`<b>Example:</b> 3 red, 2 blue. P(same colour) = 3/5 × 2/4 + 2/5 × 1/4 = 6/20 + 2/20 = 8/20 = 2/5.`)+h4('Common mistakes',`<p>Using 5/8 for both picks (that is “with replacement”), and adding when you should multiply.</p>`),
42:h4('The idea',`<p>Some equations cannot be solved exactly. Iteration repeats a formula to get closer and closer to a root.</p>`)+h4('Method',`<p>1. Start with x₀.<br>2. Put it into the formula to get x₁.<br>3. Put x₁ into the formula to get x₂, and so on.<br>4. On the calculator: type 2 =, then type √(3 × Ans + 5) and press = again and again.</p>`)+eg(`<b>Example:</b> x₍ₙ₊₁₎ = √(2xₙ + 3), x₀ = 1. x₁ = √5 = 2.236, x₂ = √7.472 = 2.734, x₃ = 2.9…`)+h4('Common mistakes',`<p>Typing the rounded value back in (small errors build up), and rounding the final answers to the wrong number of decimal places.</p>`)};

function show(n){cur=n;chips();const q=Q.find(x=>x.n==n),fg=FIG[n]?FIG[n]():'';$('card').innerHTML=`<h2>Question ${n}: ${LB[n]} <span class="tag">${q.m} marks</span></h2><h3>The question</h3><div class="ex">${q.q}</div><h3>Theory you need (Edexcel GCSE Higher)</h3><p><button class="btn" onclick="teach(${n})">🎓 Teach me</button> <span style="font-size:13px;color:var(--m)">a fuller explanation of this topic</span></p><div class="th">${TH[n]}</div><h3>Worked solution</h3><ol>${q.s.map(x=>`<li>${x}</li>`).join('')}</ol>${fg?`<div class="ex">${fg}</div>`:''}<div class="ans">Answer: ${q.a}</div>${q.t?`<div class="tip">💡 ${q.t}</div>`:''}<h3>Practice: ${LB[n]}</h3><div id="pc"></div><p class="row" style="margin-top:18px">${n>25?`<button onclick="show(${n-1})">← Q${n-1}</button>`:''}${n<42?`<button class="btn" onclick="show(${n+1})">Q${n+1} →</button>`:''}</p>`;prac(n);scrollTo(0,0)}
function prac(n){P=G[n]();$('pc').innerHTML=`<div class="ex">${P.q}</div><input id="in" placeholder="Your answer" autocomplete="off" onkeydown="if(event.key=='Enter')chk()"><div class="row"><button class="btn" onclick="chk()">Check</button><button class="alt" onclick="steps()">Show steps</button><button class="alt" onclick="prac(${n})">New question</button></div><div id="fb"></div>`}
function chk(){const v=$('in').value;$('fb').innerHTML=!v.trim()?'Type an answer first.':P.c(v)?`<b class="good">✓ Correct!</b>${P.a?' Answer: '+P.a:''}`:`<b class="no">Not quite.</b> Check your working, or tap “Show steps”.`}
function steps(){$('fb').innerHTML=`<ol>${P.st.map(x=>`<li>${x}</li>`).join('')}</ol>${P.a?`<div class="ans">Answer: ${P.a}</div>`:''}`}
function th(){const d=document.documentElement,n=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=n;$('tm').textContent=n=='dark'?'☀️ Light':'🌙 Dark';try{localStorage.setItem('th',n)}catch(e){}}
function teach(n){$('tb').innerHTML=`<h2>Teach me: ${LB[n]}</h2>${FIG[n]?`<h4>Picture it</h4><div class="eg">${FIG[n]()}</div>`:''}${TE[n]}`;$('tm2').classList.remove('hide');$('mb').scrollTop=0}
function closeT(){$('tm2').classList.add('hide')}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeT()});
const AD={key:'gcse25',title:'Questions 25–42',qfig:q=>'',sfig:q=>FIG[q.n]?FIG[q.n]():'',gen:n=>G[n]};
/* ===== learner-experience layer ===== */
const ST=(()=>{try{return JSON.parse(localStorage.getItem(AD.key)||'{}')}catch(e){return{}}})();ST.done=ST.done||[];
const sv=()=>{try{localStorage.setItem(AD.key,JSON.stringify(ST))}catch(e){}};
let streak=0,wrong=0,stepI=0,opener=null;
function chips(){const tot=Q.length,d=ST.done.filter(n=>Q.some(q=>q.n==n)).length;
$('side').innerHTML=`<b style="display:block;margin:4px 0">${AD.title}</b><div class="pg" role="progressbar" aria-valuenow="${d}" aria-valuemin="0" aria-valuemax="${tot}" aria-label="Questions completed"><i style="width:${100*d/tot}%"></i></div><div class="tx2">${d} of ${tot} done</div><button class="${cur=='fs'?'on':''}" ${cur=='fs'?'aria-current="page"':''} onclick="fsPage();tg(1)"><span>📄 Formula sheet guide</span></button><div class="tx2">📄 on sheet · ⚠️ part · 🧠 memorise</div>`+Q.map(q=>`<button class="${q.n==cur?'on':''}" ${q.n==cur?'aria-current="page"':''} onclick="show(${q.n});tg(1)"><span title="${FT[FSK[q.n].st]}">${FB[FSK[q.n].st]} Q${q.n} · ${LB[q.n]}</span>${ST.done.includes(q.n)?'<span aria-label="done">✓</span>':''}</button>`).join('')}
function tg(c){const s=$('side'),o=c?false:!s.classList.contains('open');s.classList.toggle('open',o);$('bk').classList.toggle('on',o)}
function show(n){cur=n;ST.last=n;sv();chips();const i=Q.findIndex(x=>x.n==n),q=Q[i],ss=AD.sfig(q),qf=AD.qfig(q);stepI=0;streak=0;
$('hb').textContent='Q'+n+' · '+LB[n];
$('card').innerHTML=`<h2 id="qh" tabindex="-1">Question ${n}: ${LB[n]} <span class="tag">${q.m} marks</span></h2><div class="ex">${q.q}${qf}</div><p class="tx2" style="margin:8px 0 0">💭 Have a go on paper first. Use the theory if you get stuck, then check the worked solution.</p>
<details class="sec"><summary>📘 Theory you need (Edexcel GCSE Higher)</summary>${fsBox(n)}<p><button class="btn" onclick="teach(${n})">🎓 Teach me</button> <span class="tx2">a fuller explanation with pictures</span></p><div class="th">${TH[n]}</div></details>
<details class="sec"><summary>✅ Worked solution (reveal step by step)</summary><ol class="stp">${q.s.map(x=>`<li class="hide">${x}</li>`).join('')}</ol><div id="fin" class="hide">${ss?`<div class="ex">${ss}</div>`:''}<div class="ans">Answer: ${q.a}</div>${q.t?`<div class="tip">💡 ${q.t}</div>`:''}</div><p class="row" id="srow"><button class="btn" id="nx" onclick="nextStep()">Show step 1 of ${q.s.length}</button><button class="alt" onclick="allSteps()">Show all</button></p></details>
<details class="sec"><summary>✏️ Practice: ${LB[n]}</summary><div id="pc"></div></details>
<p class="row" style="margin-top:20px">${Q[i-1]?`<button onclick="show(${Q[i-1].n})">← Q${Q[i-1].n}</button>`:''}<button class="alt" id="dn" onclick="mark()"></button>${Q[i+1]?`<button class="btn" onclick="show(${Q[i+1].n})">Q${Q[i+1].n} →</button>`:''}</p><p class="tx2">Tip: the ← → arrow keys move between questions.</p>`;
dnTxt();prac(n);try{if(location.hash!='#q'+n)location.hash='q'+n}catch(e){}scrollTo(0,0);try{$('qh').focus({preventScroll:true})}catch(e){}}
function nextStep(){const L=document.querySelectorAll('.stp li'),n=L.length;if(stepI<n){L[stepI].classList.remove('hide');stepI++}if(stepI>=n){$('fin').classList.remove('hide');$('srow').classList.add('hide')}else $('nx').textContent=`Show step ${stepI+1} of ${n}`}
function allSteps(){document.querySelectorAll('.stp li').forEach(l=>l.classList.remove('hide'));$('fin').classList.remove('hide');$('srow').classList.add('hide')}
function dnTxt(){const d=ST.done.includes(cur);$('dn').textContent=d?'✓ Done (tap to undo)':'Mark as done';$('dn').className=d?'alt okb':'alt'}
function mark(){const k=ST.done.indexOf(cur);k<0?ST.done.push(cur):ST.done.splice(k,1);sv();chips();dnTxt()}
function prac(n){const g=AD.gen(n);if(!g){$('pc').innerHTML='<p class="tx2">No practice question for this topic yet.</p>';return}P=g();P.n=n;wrong=0;
$('pc').innerHTML=`<div class="ex">${P.q}</div><label class="tx2" for="in">Your answer</label><input id="in" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')chk()"><div class="row"><button class="btn" onclick="chk()">Check</button><button class="alt" onclick="hint()">💡 Hint</button><button class="alt" onclick="steps()">Show steps</button><button class="alt" onclick="prac(${n})">New question</button></div><div id="fb" role="status" aria-live="polite"></div>`}
const fb=h=>$('fb').innerHTML=h;
function chk(){const v=$('in').value;if(!v.trim())return fb('Type an answer first.');
if(P.c(v)){streak++;wrong=0;if(!ST.done.includes(P.n)){ST.done.push(P.n);sv();chips();dnTxt()}fb(`<b class="good">✓ Correct!</b>${P.a?' Answer: '+P.a:''}${streak>1?` 🔥 ${streak} in a row`:''}<p><button class="btn" onclick="prac(${P.n});$('in').focus()">Next question →</button></p>`)}
else{streak=0;wrong++;fb(`<b class="no">Not quite yet.</b> ${wrong>1?'Try the 💡 Hint, or show the steps.':'Check your signs, units and rounding, then try again.'}`)}}
function hint(){fb(`<b>💡 Hint:</b> ${P.st[0]}`)}
function steps(){streak=0;fb(`<ol>${P.st.map(x=>`<li>${x}</li>`).join('')}</ol>${P.a?`<div class="ans">Answer: ${P.a}</div>`:''}`)}
function teach(n){opener=document.activeElement;$('tb').innerHTML=`<h2>Teach me: ${LB[n]}</h2>${FIG[n]?`<h4>Picture it</h4><div class="eg">${FIG[n]()}</div>`:''}${TE[n]}`;$('tm2').classList.remove('hide');document.body.classList.add('nos');$('mb').scrollTop=0;$('mb').focus()}
function closeT(){$('tm2').classList.add('hide');document.body.classList.remove('nos');if(opener&&opener.focus)opener.focus()}
document.addEventListener('keydown',e=>{if(e.key=='Escape')return closeT();if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||!$('tm2').classList.contains('hide'))return;if(cur=='fs')return;const i=Q.findIndex(q=>q.n==cur);if(e.key=='ArrowRight'&&Q[i+1])show(Q[i+1].n);if(e.key=='ArrowLeft'&&Q[i-1])show(Q[i-1].n)});
window.addEventListener('hashchange',()=>{if(location.hash=='#formulas'){if(cur!='fs')fsPage();return}const m=location.hash.match(/^#q(\d+)$/);if(m&&+m[1]!=cur&&Q.some(q=>q.n==+m[1]))show(+m[1])});
function init(){if(location.hash=='#formulas')return fsPage();const m=(location.hash||'').match(/^#q(\d+)$/),want=m?+m[1]:ST.last;show(Q.some(q=>q.n==want)?want:Q[0].n)}

/* ===== formula sheet layer ===== */
const FB={on:'📄',part:'⚠️',no:'🧠'},FT={on:'On the formula sheet',part:'Partly on the formula sheet',no:'NOT on the formula sheet: memorise'};
const FSK={
25:{st:'on',on:['Quadratic formula: x = (−b ± √(b² − 4ac)) ÷ 2a'],learn:['How to pick out a, b and c with their signs (c = −2 here) and when to use the formula (it is given, but you must apply it correctly)'],note:''},
26:{st:'no',on:[],learn:['AB = −a + b = b − a (going backwards reverses the sign)','Midpoint of AB: OM = ½(a + b)'],note:'Vectors are not on the sheet at all.'},
27:{st:'on',on:['Sine rule: a ÷ sin A = b ÷ sin B = c ÷ sin C'],learn:['When to use it: you know an angle and its opposite side','Angles in a triangle add up to 180°'],note:''},
28:{st:'part',on:['Cosine rule: a² = b² + c² − 2bc cos A'],learn:['The sheet gives the cosine rule for a <b>side</b>. For finding an <b>angle</b> you must rearrange it yourself or memorise cos A = (b² + c² − a²) ÷ 2bc'],note:'This is the most common trap: the angle version is not printed.'},
29:{st:'part',on:['Pythagoras: a² + b² = c²'],learn:['3D Pythagoras: d² = l² + w² + h² (not given). Or use Pythagoras twice.'],note:''},
30:{st:'no',on:[],learn:['Direct proportion: y = kx². Find k from the pair of values, then substitute.'],note:'Proportion formulas are never on the sheet.'},
31:{st:'no',on:[],learn:['Inverse proportion: p = k ÷ q (so p × q = k)'],note:'Proportion formulas are never on the sheet.'},
32:{st:'no',on:[],learn:['Similar shapes: lengths scale by k, areas by k², volumes by k³'],note:''},
33:{st:'no',on:[],learn:['Standard form: A × 10ⁿ with 1 ≤ A < 10','Index law: 10ᵃ × 10ᵇ = 10ᵃ⁺ᵇ'],note:''},
34:{st:'no',on:[],learn:['How to add fractions (common denominator) and how to factorise to simplify'],note:'No algebra methods are on the sheet.'},
35:{st:'no',on:[],learn:['Completing the square: x² + bx + c = (x + b/2)² + c − b²/4'],note:'The quadratic formula is on the sheet, but completing the square is a different method and is not given.'},
36:{st:'no',on:[],learn:['Quadratic sequence: nth term = an² + bn + c, where a = (second difference) ÷ 2'],note:''},
37:{st:'no',on:[],learn:['Substitution method for a linear and a quadratic equation, then solving the quadratic'],note:'If the quadratic will not factorise, the quadratic formula (on the sheet) can be used.'},
38:{st:'no',on:[],learn:['fg(x) = f(g(x)): do g first. gf(x) = g(f(x)): do f first.'],note:''},
39:{st:'no',on:[],learn:['Congruence conditions: SSS, SAS, ASA (AAS), RHS'],note:''},
40:{st:'no',on:[],learn:['Angle at the centre = 2 × angle at the circumference','Opposite angles in a cyclic quadrilateral add up to 180°'],note:'Circle theorems are never on the sheet, and you must name the theorem as your reason.'},
41:{st:'part',on:['P(A and B) = P(A given B) × P(B)  (this is the “multiply along the branches” rule)'],learn:['Without replacement: the second probability uses one fewer counter','“Same colour” means RR or BB: multiply along each route, then add the routes'],note:'The sheet gives the rule but not how to build or use a tree diagram.'},
42:{st:'no',on:[],learn:['Iteration: x₍ₙ₊₁₎ = f(xₙ). Use the calculator Ans key and keep full values between steps.'],note:'The root could be checked with the quadratic formula (on the sheet).'}};
function fsBox(n){const k=FSK[n],h={on:'📄 On your formula sheet',part:'⚠️ Only partly on your formula sheet',no:'🧠 NOT on your formula sheet: you must memorise this'}[k.st];
return `<div class="fsb fs-${k.st}"><b>${h}</b>${k.on.length?`<p class="fsl">Given on the sheet:</p><ul>${k.on.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${k.learn.length?`<p class="fsl">${k.st=='on'?'Also make sure you know:':'🧠 Learn this before the exam (not given):'}</p><ul>${k.learn.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${k.note?`<p class="tx2">${k.note}</p>`:''}<p class="tx2"><a href="#formulas" onclick="fsPage();return false">Full formula sheet guide →</a></p></div>`}
const FSO=['Area of a trapezium = ½(a + b)h  (a, b parallel sides; h perpendicular height)','Volume of a prism = area of cross-section × length','Circumference of a circle = 2πr = πd','Area of a circle = πr²','Quadratic formula: for ax² + bx + c = 0 (a ≠ 0), x = (−b ± √(b² − 4ac)) ÷ 2a','Pythagoras: a² + b² = c²  (c is the hypotenuse)','Right-angled trigonometry: sin A = a/c, cos A = b/c, tan A = a/b  (a opposite A, b adjacent, c hypotenuse)','Sine rule: a/sin A = b/sin B = c/sin C','Cosine rule: a² = b² + c² − 2bc cos A','Area of a triangle = ½ab sin C','Compound interest: total accrued = P(1 + r/100)ⁿ','P(A or B) = P(A) + P(B) − P(A and B)','P(A and B) = P(A given B) × P(B)'];
const FSM=[['Number',[['Standard form','A × 10ⁿ with 1 ≤ A < 10 and n an integer'],['Index laws','aᵐ × aⁿ = aᵐ⁺ⁿ, aᵐ ÷ aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1, a⁻ⁿ = 1/aⁿ'],['Surds','√(ab) = √a × √b, and √a × √a = a'],['Bounds','Nearest unit: ± half a unit. Lower bound ≤ value &lt; upper bound'],['Percentage change','change ÷ original × 100'],['Simple interest','I = P × r × t ÷ 100']]],
['Algebra',[['Difference of two squares','a² − b² = (a + b)(a − b)'],['Completing the square','x² + bx + c = (x + b/2)² + c − b²/4'],['Quadratic sequence','nth term = an² + bn + c, a = (second difference) ÷ 2'],['Straight line','y = mx + c; gradient = (y₂ − y₁) ÷ (x₂ − x₁); parallel lines have equal m; perpendicular lines have m₁ × m₂ = −1'],['Circle, centre origin','x² + y² = r²'],['Composite function','fg(x) = f(g(x)); do g first']]],
['Ratio and proportion',[['Direct proportion','y = kx, y = kx² (find k first)'],['Inverse proportion','y = k ÷ x'],['Speed','speed = distance ÷ time'],['Density','density = mass ÷ volume'],['Pressure','pressure = force ÷ area'],['Similar shapes','lengths × k, areas × k², volumes × k³']]],
['Geometry and measures',[['Area of a triangle','½ × base × height'],['Area of a parallelogram','base × perpendicular height'],['Volume and surface of a cylinder','V = πr²h, curved surface area = 2πrh'],['Arc length and sector area','arc = (θ/360) × πd, sector = (θ/360) × πr²'],['Angle facts','triangle 180°, quadrilateral 360°, polygon (n − 2) × 180°, exterior angles 360°'],['3D Pythagoras','d² = l² + w² + h²'],['Cosine rule for an angle','cos A = (b² + c² − a²) ÷ 2bc'],['Exact trig values','sin 30° = ½, cos 30° = √3/2, tan 30° = 1/√3; sin 45° = cos 45° = √2/2, tan 45° = 1; sin 60° = √3/2, cos 60° = ½, tan 60° = √3'],['Circle theorems','angle at centre = 2 × angle at circumference; angle in a semicircle = 90°; opposite angles of a cyclic quadrilateral = 180°; tangent ⟂ radius'],['Congruent triangles','SSS, SAS, ASA (AAS), RHS'],['Vectors','AB = b − a; midpoint = ½(a + b)']]],
['Probability and statistics',[['Probability','successful outcomes ÷ total outcomes; P(not A) = 1 − P(A)'],['Independent events','P(A and B) = P(A) × P(B)'],['Expected frequency','probability × number of trials'],['Averages and spread','mean = total ÷ number of values; range = greatest − least; IQR = UQ − LQ'],['Histograms','frequency density = frequency ÷ class width; frequency = frequency density × class width']]]];
const FSX=[['Curved surface area of a cone','πrl'],['Surface area of a sphere','4πr²'],['Volume of a sphere','⁴⁄₃πr³'],['Volume of a cone','⅓πr²h']];
ST.know=ST.know||[];let fsq=0;
function fsCount(){const t=FSM.reduce((a,g)=>a+g[1].length,0);$('kc').textContent=`${ST.know.length} of ${t} learned`}
function fsKnow(i,c){const k=ST.know.indexOf(i);if(c&&k<0)ST.know.push(i);if(!c&&k>=0)ST.know.splice(k,1);sv();fsCount()}
function fsQuiz(){fsq=!fsq;$('fsm').classList.toggle('fsq',!!fsq);$('qz').textContent=fsq?'Show all answers':'Test yourself (hide answers)';document.querySelectorAll('.fsf.rv').forEach(e=>e.classList.remove('rv'))}
function fsPage(){cur='fs';fsq=0;chips();$('hb').textContent='Formula sheet guide';let i=0;
$('card').innerHTML=`<h2>📄 Formula sheet guide</h2><div class="fsb fs-no"><b>Read this first</b><p>In the exam you get a short formula sheet, printed as an insert with your paper. <b>Most of the formulas you need are NOT on it.</b> Everything marked 🧠 below you must <b>learn and be able to write from memory before the exam</b>. The sheet gives you a formula, never the method for using it.</p></div>
<h3>Jump to a question (each has a badge)</h3><p class="row">${Q.map(q=>`<button class="alt" onclick="show(${q.n})">${FB[FSK[q.n].st]} Q${q.n}</button>`).join('')}</p><p class="tx2">📄 on the sheet · ⚠️ only partly on the sheet · 🧠 not on the sheet, memorise</p>
<details class="sec"><summary>📄 On the sheet: you will be given these</summary><ul>${FSO.map(x=>`<li>${x}</li>`).join('')}</ul><p class="tx2">You do not need to memorise these, but you must still know <i>when</i> and <i>how</i> to use them.</p></details>
<details class="sec"><summary>🧠 NOT on the sheet: memorise these</summary><p class="row"><button id="qz" onclick="fsQuiz()">Test yourself (hide answers)</button><span class="tx2" id="kc"></span></p><div id="fsm">${FSM.map(g=>`<p class="fsg">${g[0]}</p>`+g[1].map(r=>{const k=i++;return`<div class="fsr"><input type="checkbox" aria-label="I know: ${r[0]}" ${ST.know.includes(k)?'checked':''} onchange="fsKnow(${k},this.checked)"><span class="fsn">${r[0]}</span><button class="fsf" onclick="this.classList.toggle('rv')">${r[1]}</button></div>`}).join('')).join('')}</div><p class="tx2">Tick each one when you can write it from memory. In test mode, tap a blurred formula to check yourself.</p></details>
<details class="sec"><summary>⚠️ Might be printed in a question: do not rely on it</summary><p>The specification says these may be given <i>inside the question</i> (for example, the cone formula was printed in an earlier frustum question), but they are <b>not</b> on the formula sheet and may not be given. Learn them to be safe.</p><ul>${FSX.map(x=>`<li>${x[0]} = ${x[1]}</li>`).join('')}</ul></details>
<p class="tx2">Based on the Pearson Edexcel GCSE (9–1) Mathematics (1MA1) Higher tier exam aid, June 2025, and the specification. <a href="https://qualifications.pearson.com/content/dam/pdf/GCSE/mathematics/2015/teaching-and-learning-materials/gcse-mathematics-1ma1-exam-aid-1h2h3h-june2025.pdf" target="_blank" rel="noopener">Open the official sheet (PDF)</a>. The sheet can change between exam series, so check the one for your own exam.</p>`;
fsCount();try{if(location.hash!='#formulas')location.hash='formulas'}catch(e){}scrollTo(0,0)}

init();

</script></body></html>
